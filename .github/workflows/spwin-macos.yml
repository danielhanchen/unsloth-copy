# macOS and Linux must be untouched by this change.
#
# The expectation here is the OPPOSITE of the Windows treatment leg: off Windows the default
# keeps sentencepiece, so it must still load and still work. That is why both legs run in
# `control` mode, whose assertion is "sentencepiece was loaded". A pass here is what says the
# change did not quietly disable sentencepiece for every Mac and Linux user.
name: "PR-10593 macos and linux unaffected"

on:
  push:
    branches: [pr-10593-spwin-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unaffected:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            leg: macos-default-keeps-it
          - os: ubuntu-latest
            leg: linux-default-keeps-it
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "transformers==5.5.0" sentencepiece protobuf huggingface_hub tiktoken blobfile
          python -m pip install "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
          python -m pip install unsloth_zoo trl peft datasets accelerate

      - name: Probe, default settings
        env:
          PROBE_IMPORT_UNSLOTH: "1"
          PROBE_MODELS: "unsloth/Llama-3.2-1B-Instruct"
          UNSLOTH_IS_PRESENT: "1"
          UNSLOTH_COMPILE_DISABLE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python tests/ci/ci_probe_sentencepiece.py control

      - name: The opt-in flag works off Windows too
        env:
          UNSLOTH_DISABLE_SENTENCEPIECE: "1"
          PROBE_IMPORT_UNSLOTH: "1"
          PROBE_MODELS: "unsloth/Llama-3.2-1B-Instruct"
          UNSLOTH_IS_PRESENT: "1"
          UNSLOTH_COMPILE_DISABLE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python tests/ci/ci_probe_sentencepiece.py treatment

      # control mode, so the assertion is "a worker still loads sentencepiece": off Windows the
      # shared entrypoint must leave it alone.
      - name: The worker entrypoint leaves it alone off Windows
        env:
          PROBE_MODELS: "unsloth/gemma-3-270m-it"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python tests/ci/ci_probe_worker_entrypoint.py control

      - name: Unit tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_windows_no_sentencepiece.py -q
