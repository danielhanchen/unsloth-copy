name: apple-probe
on:
  push:
    branches: ["apple-probe-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: arch
        run: |
          uname -m; sysctl -n machdep.cpu.brand_string || true
      - name: install torch
        run: python -m pip install --upgrade pip && python -m pip install torch
      - name: install mlx + unsloth (best effort)
        continue-on-error: true
        run: python -m pip install mlx mlx-lm unsloth unsloth_zoo
      - name: probe
        run: python -m pytest tests/apple_probe/test_apple_probe.py -s -v
