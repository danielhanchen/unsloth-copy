name: apple-probe
on:
  push:
    branches: ["apple-probe-ci"]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup
        with:
          python-version: "3.12"
      - name: arch + interpreter
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          echo "resolved python-path: ${{ steps.setup.outputs.python-path }}"
          "${{ steps.setup.outputs.python-path }}" -c "import sys,platform;print(sys.executable, platform.machine())"
      - name: install torch + pytest
        run: |
          P="${{ steps.setup.outputs.python-path }}"
          "$P" -m pip install --upgrade pip
          "$P" -m pip install pytest torch
      - name: install mlx + unsloth (best effort)
        continue-on-error: true
        run: |
          P="${{ steps.setup.outputs.python-path }}"
          "$P" -m pip install mlx mlx-lm unsloth unsloth_zoo
          # Unsloth deps pin torch down (2.14 -> 2.11); FlexAttention-on-MPS landed in
          # 2.13, so restore a modern torch or the flex probe tests the wrong version.
          "$P" -m pip install --upgrade "torch>=2.14"
          "$P" -c "import torch;print('torch after restore:',torch.__version__)"
      - name: probe
        run: |
          P="${{ steps.setup.outputs.python-path }}"
          "$P" -m pytest tests/apple_probe/test_apple_probe.py -s -v
      # Lives OUTSIDE tests/ and runs in its own process, both on purpose:
      # tests/conftest.py:218 does `import unsloth`, which on Apple Silicon installs a
      # meta-path finder that stubs out `triton` (unsloth_zoo/stubs/triton_stub.py).
      # Inductor's compile path calls triton.runtime.cache.triton_key, so any
      # torch.compile in such a process dies with NotImplementedError -- which is what
      # killed every FlexAttention cell in the two previous runs.
      - name: attention benchmark (no unsloth import)
        run: |
          P="${{ steps.setup.outputs.python-path }}"
          "$P" -m pytest apple_attn_bench/test_attention_bench.py -s -v
