name: "staging-10358 windows-latest"
on:
  push:
    branches: ["pr-10358-xplat-ci"]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_a_diffusion_runner_never_asks_for_an_exact_reload.py studio/backend/tests/test_a_parallel_round_charges_its_arguments_once.py studio/backend/tests/test_a_pause_keeps_the_thought_and_a_stop_ends_the_wait.py studio/backend/tests/test_a_raw_park_reaches_the_client_and_exact_needs_the_server_to_park.py studio/backend/tests/test_admission_switches_are_honoured_everywhere.py studio/backend/tests/test_anthropic_messages.py studio/backend/tests/test_checkpoint_compaction.py studio/backend/tests/test_exact_concurrency_switch.py studio/backend/tests/test_external_tool_edge_cases.py studio/backend/tests/test_llama_admission_compat_matrix.py studio/backend/tests/test_llama_admission_enforced_max_tokens.py studio/backend/tests/test_llama_admission_kv_budget.py studio/backend/tests/test_llama_admission_unstated_max_tokens.py studio/backend/tests/test_llama_cpp_tool_loop.py studio/backend/tests/test_llama_plain_chat_preempt_resume.py studio/backend/tests/test_llama_preemption.py studio/backend/tests/test_llama_preemption_is_armed_on_chat_surfaces.py studio/backend/tests/test_llama_tool_loop_preempt_resume.py studio/backend/tests/test_parallel_round_divides_room_among_launched_calls.py studio/backend/tests/test_research_internal_call_tool_gate.py studio/backend/tests/test_server_side_preemption_handoff.py studio/backend/tests/test_studio_tool_loop.py studio/backend/tests/test_studio_tool_loop_preemption.py studio/backend/tests/test_tool_calls_within_one_turn_overlap.py unsloth_cli/tests/test_studio_venv_symlink_handoff.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' > pytest_out.txt 2>&1 || rc=$?; cat pytest_out.txt; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; if [ "$rc" = "2" ] && grep -qE "No module named .(torch|unsloth_zoo|transformers)." pytest_out.txt && ! grep -qE "^(FAILED|ERROR) " pytest_out.txt; then echo "collection needs a dep this runner does not ship"; rc=0; fi; if [ "$rc" = "1" ] && ! grep -qE "^ERROR " pytest_out.txt; then tot=$(grep -cE "^FAILED " pytest_out.txt); dep=$(grep -cE "^FAILED .* No module named .(torch|unsloth_zoo|transformers).$" pytest_out.txt); if [ "$tot" -gt 0 ] && [ "$tot" = "$dep" ]; then echo "only tests needing a dep this runner does not ship failed"; rc=0; fi; fi; exit "$rc"
