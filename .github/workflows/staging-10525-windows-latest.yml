name: "staging-10525 windows-latest"
on:
  push:
    branches: ["pr-10525-xplat-ci"]
    paths:
      - 'studio/backend/core/inference/diffusion.py'
      - 'studio/backend/core/inference/diffusion_precision.py'
      - 'studio/backend/core/inference/diffusion_speed.py'
      - 'studio/backend/core/inference/diffusion_torchao_patches.py'
      - 'studio/backend/core/inference/diffusion_transformer_quant.py'
      - 'studio/backend/core/inference/video.py'
      - 'studio/backend/core/training/diffusion_dit_trainer.py'
      - 'studio/backend/core/training/diffusion_train_common.py'
      - 'studio/backend/tests/test_diffusion_precision.py'
      - 'studio/backend/tests/test_diffusion_speed.py'
      - 'studio/backend/tests/test_diffusion_transformer_quant.py'
      - 'studio/backend/tests/test_torchao_intmm_patch_wiring.py'
      - '.github/workflows/staging-10525-windows-latest.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      UNSLOTH_COMPILE_DISABLE: '1'
      UNSLOTH_IS_PRESENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/backend/requirements/studio.txt pytest pytest-asyncio pytest-timeout python-multipart
      - run: rc=0; PYTHONPATH=studio/backend python -m pytest studio/backend/tests/test_diffusion_precision.py studio/backend/tests/test_diffusion_speed.py studio/backend/tests/test_diffusion_transformer_quant.py studio/backend/tests/test_torchao_intmm_patch_wiring.py tests/test_import_fixes_drift.py -q --tb=short -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda' || rc=$?; if [ "$rc" = "5" ]; then echo "no tests ran (deps absent on this runner)"; rc=0; fi; exit "$rc"
