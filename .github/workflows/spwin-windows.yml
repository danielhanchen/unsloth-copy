# Does anything load sentencepiece on a real Windows runner?
#
# Two legs, and the pair is the evidence. The control opts back in with
# UNSLOTH_DISABLE_SENTENCEPIECE=0 and MUST load sentencepiece; if it does not, the probe
# cannot see a load and the treatment result means nothing, so the control failing is a VOID
# rather than a pass. The treatment runs the shipped default and must never load it.
#
# sentencepiece is installed explicitly in both legs. A runner without it would pass the
# treatment leg for the wrong reason, which the probe also checks and calls VOID.
name: "PR-10593 windows sentencepiece"

on:
  push:
    branches: [pr-10593-spwin-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # transformers only, which is the Studio parent's shape: it inlines the same rule
          # and deliberately never imports unsloth.
          - leg: studio-control
            mode: control
            flag: "0"
            unsloth: "0"
          - leg: studio-treatment
            mode: treatment
            flag: ""
            unsloth: "0"
          # The full package entry point, which is what a user runs.
          - leg: unsloth-control
            mode: control
            flag: "0"
            unsloth: "1"
          - leg: unsloth-treatment
            mode: treatment
            flag: ""
            unsloth: "1"
    name: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # sentencepiece explicitly: the question is whether an INSTALLED package is
          # imported, not whether an absent one is.
          python -m pip install "transformers==5.5.0" sentencepiece protobuf huggingface_hub tiktoken blobfile
          if ("${{ matrix.unsloth }}" -eq "1") {
            python -m pip install "torch>=2.6" --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -e . --no-deps
            python -m pip install unsloth_zoo trl peft datasets accelerate bitsandbytes-windows 2>&1 | Out-Null
            python -m pip install unsloth_zoo trl peft datasets accelerate
          }
          python -c "import sentencepiece, sys; print('sentencepiece', sentencepiece.__version__, 'importable in a fresh process')"

      - name: Probe
        shell: pwsh
        env:
          UNSLOTH_DISABLE_SENTENCEPIECE: ${{ matrix.flag }}
          PROBE_IMPORT_UNSLOTH: ${{ matrix.unsloth }}
          PROBE_MODELS: "unsloth/Llama-3.2-1B-Instruct,unsloth/gemma-3-270m-it"
          UNSLOTH_IS_PRESENT: "1"
          UNSLOTH_COMPILE_DISABLE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          # An empty matrix flag must mean UNSET, not empty string. GitHub exports "" for an
          # empty env value, and the probe treats an unrecognised value as the platform
          # default, so this happens to be equivalent; removed anyway so the leg tests the
          # real shipped path rather than a lookalike.
          if ("${{ matrix.flag }}" -eq "") { Remove-Item Env:\UNSLOTH_DISABLE_SENTENCEPIECE -ErrorAction SilentlyContinue }
          python tests/ci/ci_probe_sentencepiece.py ${{ matrix.mode }}

  # The Studio worker shape. Workers are spawned interpreters that import transformers long
  # before they import unsloth, so the rule has to be installed by their shared entrypoint,
  # utils.native_path_leases.run_without_native_path_secret, before it imports the worker
  # module. transformers and sentencepiece only: this path deliberately costs no torch.
  worker-entrypoint:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: worker-control
            mode: control
            flag: "0"
          - leg: worker-treatment
            mode: treatment
            flag: ""
    name: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "transformers==5.5.0" sentencepiece protobuf huggingface_hub tiktoken blobfile
          python -c "import sentencepiece, sys; print('sentencepiece', sentencepiece.__version__, 'importable in a fresh process')"

      - name: Probe
        shell: pwsh
        env:
          UNSLOTH_DISABLE_SENTENCEPIECE: ${{ matrix.flag }}
          PROBE_MODELS: "unsloth/gemma-3-270m-it"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          if ("${{ matrix.flag }}" -eq "") { Remove-Item Env:\UNSLOTH_DISABLE_SENTENCEPIECE -ErrorAction SilentlyContinue }
          python tests/ci/ci_probe_worker_entrypoint.py ${{ matrix.mode }}
