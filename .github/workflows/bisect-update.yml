      # true, which would silently disarm the assert on every push run.
      EXPECT_IDEMPOTENT: ${{ (github.event_name == 'workflow_dispatch' && inputs.expect_idempotent == false) && '0' || '1' }}
      BISECT_DIR: ${{ github.workspace }}/scripts/bisect
      SOURCE_ROOT: ${{ github.workspace }}
      PR_WHEEL_DIR: ${{ github.workspace }}/prwheel
      PR_WHEEL_DIR2: ${{ github.workspace }}/prwheel2
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner facts
        shell: bash
        run: |
          mkdir -p "$OUT"
          { echo "os=${{ matrix.os }} image=$ImageOS/$ImageVersion arch=$(uname -m 2>/dev/null || echo $PROCESSOR_ARCHITECTURE)"; uname -a 2>/dev/null || true; df -h . 2>/dev/null || true; } | tee "$OUT/runner.txt"
      - name: Build the PR wheel from this branch
        shell: bash
        # The whole point of the PR jobs: `studio update` must resolve `unsloth` to THIS branch
        # while still being run by the old installed release's own CLI. pr_wheel.py checks that
        # the version pyproject declares, the wheel METADATA and the wheel filename agree, then
        # relabels it `<version>.post1` before layering `unsloth==<version>.post1` over the
        # release pins. The relabel matters: a PR branches off main while _version.py still holds
        # the LAST RELEASE's number, so without it `unsloth==<version>` would also be satisfiable
        # from PyPI and a job could pass having installed the very release it was meant to
        # replace. `.postN` rather than a local label `+pr`: the installer builds its own floor as
        # `unsloth>=<version>`, and PEP 440 forbids `>=` against a local segment (observed: both
        # uv and pip refuse to parse it and the update dies before it starts).
        run: |
          set -o pipefail
          python -m pip install --quiet build
          rm -rf "$PR_WHEEL_DIR"
          mkdir -p "$PR_WHEEL_DIR"
          python -m build --wheel --outdir "$PR_WHEEL_DIR"
          ls -l "$PR_WHEEL_DIR"
          python scripts/bisect/pr_wheel.py verify --source . --wheel-dir "$PR_WHEEL_DIR"
          python scripts/bisect/pr_wheel.py relabel --wheel-dir "$PR_WHEEL_DIR" --post 1 | tee "$OUT/pr_wheel.json"
      - name: Fresh PR install, then break one thing at a time (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          export RUN_ROOT="$RUNNER_TEMP/bisect"
          B="$BISECT_DIR/run_step.sh"
          bash "$B" install pr
          for k in sidecar-dist-info sidecar-truncate manifest req-edit llama-truncate; do
            bash "$B" fault "$k" || exit 1
            bash "$B" noop-update "after-$k" || exit 1
          done
      - name: Fresh PR install, then break one thing at a time (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $B = Join-Path $env:BISECT_DIR "run_step.ps1"
          pwsh -NoProfile -File $B -Cmd install -N pr
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($k in "sidecar-dist-info", "sidecar-truncate", "manifest", "req-edit", "llama-truncate") {
            pwsh -NoProfile -File $B -Cmd fault -Kind $k
            if ($LASTEXITCODE -ne 0) { exit 1 }
            pwsh -NoProfile -File $B -Cmd noop-update -Label "after-$k"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          exit 0
      - name: Assert every repair settled back to a no-op
        if: always()
        shell: bash
        run: |
          python3 scripts/bisect/report.py --roots "$OUT" --assert idempotent \
            --expect-idempotent "$EXPECT_IDEMPOTENT"
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 scripts/bisect/report.py --roots "$OUT" --step-summary >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bisect-${{ matrix.os }}-faults
          path: results/**
          if-no-files-found: warn

  prefetch:
    needs: plan
    if: needs.plan.outputs.has_prefetch == 'true'
    name: ${{ matrix.os }} prefetch then offline swap
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prefetch) }}
    env:
      OUT: ${{ github.workspace }}/results/${{ matrix.os }}-prefetch
      BISECT_REAL_HOME: '1'
      BISECT_DIR: ${{ github.workspace }}/scripts/bisect
