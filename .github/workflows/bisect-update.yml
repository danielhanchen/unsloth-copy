        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          export RUN_ROOT="$RUNNER_TEMP/bisect"
          B="$BISECT_DIR/run_step.sh"
          bash "$B" install pr
          bash "$B" old-shell-stage
