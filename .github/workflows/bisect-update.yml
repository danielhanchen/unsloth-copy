  cargo-legacy-tests:
    needs: plan
    if: needs.plan.outputs.has_cargo == 'true'
    name: ${{ matrix.os }} cargo test staged_update
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cargo) }}
    env:
      OUT: ${{ github.workspace }}/results/${{ matrix.os }}-cargo
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux native deps for Tauri / WebKit2GTK
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        # The same package set studio-tauri-smoke.yml installs; without them the crate does not
        # link on Linux and `cargo test` reports a build error rather than a test result.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Frontend build (npm ci, vite)
        # The crate's tests are compiled against tauri.conf.json's distDir, so the frontend has to
        # exist first -- exactly as in studio-tauri-smoke.yml.
        shell: bash
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build
          test -f dist/index.html
      - name: cargo test staged_update
        shell: bash
        # The legacy-state reconciliation itself lives in Rust; the harness only prepares the
        # fixtures (run_step.* leftover-seed / leftover-check). This is where it is exercised.
        run: |
          set -o pipefail
          mkdir -p "$OUT"
          if ! command -v cargo > /dev/null 2>&1; then
            echo "::warning::no Rust toolchain on this runner; the legacy-state tests did not run"
            echo '{"label": "cargo-legacy-tests", "skipped": "no rust toolchain", "exit_code": 0}' > "$OUT/summary.json"
            exit 0
          fi
          cd studio/src-tauri
          cargo test staged_update --no-fail-fast 2>&1 | tee "$OUT/cargo.log"
          rc=${PIPESTATUS[0]}
          python3 -c "import json,sys; json.dump({'label':'cargo-legacy-tests','exit_code':int(sys.argv[1])}, open(sys.argv[2],'w'))" "$rc" "$OUT/summary.json"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bisect-${{ matrix.os }}-cargo
          path: results/**
          if-no-files-found: warn
