      - name: Build the PR wheel from this branch
        shell: bash
        # The whole point of the PR jobs: `studio update` must resolve `unsloth` to THIS branch
        # while still being run by the old installed release's own CLI. pr_wheel.py checks that
        # the version pyproject declares, the wheel METADATA and the wheel filename agree, then
        # relabels it `<version>.post1` before layering `unsloth==<version>.post1` over the
        # release pins. The relabel matters: a PR branches off main while _version.py still holds
        # the LAST RELEASE's number, so without it `unsloth==<version>` would also be satisfiable
        # from PyPI and a job could pass having installed the very release it was meant to
        # replace. `.postN` rather than a local label `+pr`: the installer builds its own floor as
        # `unsloth>=<version>`, and PEP 440 forbids `>=` against a local segment (observed: both
        # uv and pip refuse to parse it and the update dies before it starts).
        run: |
          set -o pipefail
          python -m pip install --quiet build
          rm -rf "$PR_WHEEL_DIR"
          mkdir -p "$PR_WHEEL_DIR"
          python -m build --wheel --outdir "$PR_WHEEL_DIR"
          ls -l "$PR_WHEEL_DIR"
          python scripts/bisect/pr_wheel.py verify --source . --wheel-dir "$PR_WHEEL_DIR"
          python scripts/bisect/pr_wheel.py relabel --wheel-dir "$PR_WHEEL_DIR" --post 1 | tee "$OUT/pr_wheel.json"
      - name: Second wheel with a bumped version (the prefetch target)
        shell: bash
        # `pr2` is the same wheel republished as `<version>.post2`, one post-release above the
        # `pr` wheel, so "the prefetch fetched the NEW backend" is unambiguous. pr_wheel.py skips
        # any .postN that PyPI actually publishes.
        run: |
          set -o pipefail
          rm -rf "$PR_WHEEL_DIR2"
          python scripts/bisect/pr_wheel.py bump --wheel-dir "$PR_WHEEL_DIR" --out-dir "$PR_WHEEL_DIR2" --post 2 | tee "$OUT/pr_wheel2.json"
      - name: 806 -> PR, prefetch pr2, then swap with PyPI and GitHub refused (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          export RUN_ROOT="$RUNNER_TEMP/bisect"
          B="$BISECT_DIR/run_step.sh"
          bash "$B" install 806
          bash "$B" update 806 pr
          bash "$B" prefetch --target pr2
          supported=$(python3 -c "import json; print(json.load(open('$OUT/prefetch-pr2/summary.json'))['prefetch_supported'])")
          if [ "$supported" = True ]; then
            bash "$B" update pr pr2 --offline-pypi
          else
            echo "::warning::the installed CLI has no studio prefetch-update (PR C not present); offline swap skipped"
          fi
      - name: 806 -> PR, prefetch pr2, then swap with PyPI and GitHub refused (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $B = Join-Path $env:BISECT_DIR "run_step.ps1"
          pwsh -NoProfile -File $B -Cmd install -N 806
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -File $B -Cmd update -N 806 -To pr
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -File $B -Cmd prefetch -Target pr2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $s = Get-Content (Join-Path $env:OUT "prefetch-pr2/summary.json") -Raw | ConvertFrom-Json
          if ($s.prefetch_supported) {
            pwsh -NoProfile -File $B -Cmd update -N pr -To pr2 -OfflinePypi
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host "::warning::the installed CLI has no studio prefetch-update (PR C not present); offline swap skipped"
          }
          exit 0
      - name: Assert the prefetch touched only the cache
        if: always()
        shell: bash
        run: |
          python3 scripts/bisect/report.py --roots "$OUT" --assert prefetch
      - name: Summary
        if: always()
        shell: bash
        run: |
          python3 scripts/bisect/report.py --roots "$OUT" --step-summary >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bisect-${{ matrix.os }}-prefetch
          path: results/**
          if-no-files-found: warn

